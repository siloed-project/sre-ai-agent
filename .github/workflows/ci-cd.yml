name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt
      - name: Run tests
        run: .venv/bin/pytest

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
      - name: Add VPS to known hosts
        run: ssh-keyscan -H ${{ secrets.VPS_IP }} >> ~/.ssh/known_hosts
      - name: Deploy to VPS
        run: |
          ssh deploy@${{ secrets.VPS_IP }} '
            set -e
            cd /opt/sre-agent
            git fetch
            git reset --hard origin/main
            .venv/bin/pip install -r requirements.txt
            .venv/bin/python3 - << PYEOF
          import sys, traceback, sqlite3, os
          os.environ.setdefault("TELEGRAM_BOT_TOKEN", "dummy")
          os.environ.setdefault("ALLOWED_CHAT_IDS", "0")
          os.environ.setdefault("ANTHROPIC_API_KEY", "sk-ant-dummy")
          try:
              from langgraph.checkpoint.sqlite import SqliteSaver
              from app.graph import build_agent
              conn = sqlite3.connect(":memory:")
              cp = SqliteSaver(conn)
              build_agent(checkpointer=cp)
              print("pre-flight OK")
          except Exception:
              traceback.print_exc()
              sys.exit(1)
          PYEOF
            sudo cp /opt/sre-agent/deploy/sre-agent.service /etc/systemd/system/sre-agent.service
            sudo systemctl daemon-reload
            sudo systemctl restart sre-agent
            sleep 5
            systemctl is-active --quiet sre-agent || { systemctl status sre-agent --no-pager -l; exit 1; }
          '
