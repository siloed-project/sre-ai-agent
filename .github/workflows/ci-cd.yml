name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt
      - name: Run tests
        run: .venv/bin/pytest

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
      - name: Add VPS to known hosts
        run: ssh-keyscan -H ${{ secrets.VPS_IP }} >> ~/.ssh/known_hosts
      - name: Deploy to VPS
        run: |
          ssh deploy@${{ secrets.VPS_IP }} '
            set -e
            cd /opt/sre-agent
            git fetch
            git reset --hard origin/main
            command -v docker >/dev/null || { echo "Docker is not installed" >&2; exit 1; }
            command -v nginx >/dev/null || { echo "Nginx is not installed" >&2; exit 1; }
            command -v cloudflared >/dev/null || { echo "cloudflared is not installed" >&2; exit 1; }
            docker compose version >/dev/null || { echo "Docker Compose is unavailable" >&2; exit 1; }
            for required_file in /etc/sre-agent/env /etc/sre-agent/langfuse.env /etc/sre-agent/cloudflared.env /etc/sre-agent/cloudflared-kube.env; do
              size=$(sudo stat -c %s "$required_file" 2>/dev/null || true)
              [ "${size:-0}" -gt 0 ] || { echo "Missing or empty $required_file" >&2; exit 1; }
            done
            .venv/bin/pip install -r requirements.txt
            .venv/bin/python3 - << PYEOF
          import sys, traceback, sqlite3, os
          os.environ.setdefault("TELEGRAM_BOT_TOKEN", "dummy")
          os.environ.setdefault("ALLOWED_CHAT_IDS", "0")
          os.environ.setdefault("ANTHROPIC_API_KEY", "sk-ant-dummy")
          try:
              from langgraph.checkpoint.sqlite import SqliteSaver
              from app.graph import build_agent
              conn = sqlite3.connect(":memory:")
              cp = SqliteSaver(conn)
              build_agent(checkpointer=cp)
              print("pre-flight OK")
          except Exception:
              traceback.print_exc()
              sys.exit(1)
          PYEOF
            sudo cp /opt/sre-agent/deploy/sre-agent.service /etc/systemd/system/sre-agent.service
            sudo cp /opt/sre-agent/deploy/sre-agent-langfuse.service /etc/systemd/system/sre-agent-langfuse.service
            sudo cp /opt/sre-agent/deploy/sre-agent-cleanup.service /etc/systemd/system/sre-agent-cleanup.service
            sudo cp /opt/sre-agent/deploy/sre-agent-cleanup.timer /etc/systemd/system/sre-agent-cleanup.timer
            sudo cp /opt/sre-agent/deploy/sre-agent-cloudflared.service /etc/systemd/system/sre-agent-cloudflared.service
            sudo cp /opt/sre-agent/deploy/sre-agent-cloudflared-kube.service /etc/systemd/system/sre-agent-cloudflared-kube.service
            sudo cp /opt/sre-agent/nginx/langfuse-proxy.conf /etc/nginx/snippets/langfuse-proxy.conf
            sudo cp /opt/sre-agent/nginx/sre-agent.conf /etc/nginx/sites-available/sre-agent.conf
            sudo ln -sfn /etc/nginx/sites-available/sre-agent.conf /etc/nginx/sites-enabled/sre-agent.conf
            sudo nginx -t
            sudo systemctl daemon-reload
            sudo systemctl enable --now nginx sre-agent-langfuse sre-agent-cleanup.timer sre-agent-cloudflared sre-agent-cloudflared-kube
            sudo systemctl restart sre-agent sre-agent-langfuse sre-agent-cloudflared sre-agent-cloudflared-kube
            sudo systemctl reload nginx
            sleep 5
            systemctl is-active --quiet sre-agent || { systemctl status sre-agent --no-pager -l; exit 1; }
            systemctl is-active --quiet sre-agent-langfuse || { systemctl status sre-agent-langfuse --no-pager -l; exit 1; }
            systemctl is-active --quiet sre-agent-cloudflared || { systemctl status sre-agent-cloudflared --no-pager -l; exit 1; }
            systemctl is-active --quiet sre-agent-cloudflared-kube || { systemctl status sre-agent-cloudflared-kube --no-pager -l; exit 1; }
            systemctl is-active --quiet nginx || { systemctl status nginx --no-pager -l; exit 1; }
          '
