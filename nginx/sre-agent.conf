# nginx reverse proxy for the LangFuse dashboard
#
# Deploy: copy to /etc/nginx/sites-available/sre-agent.conf
#         ln -s /etc/nginx/sites-available/sre-agent.conf /etc/nginx/sites-enabled/
#         nginx -t && systemctl reload nginx
#
# Bound to loopback only: the public entry point is a Cloudflare Tunnel
# (sre-agent-cloudflared.service). cloudflared's origin service is
# http://localhost:80, and "localhost" can resolve to ::1 before 127.0.0.1
# — both loopback addresses must be listed here or IPv6 requests fall
# through to nginx's default_server (the Ubuntu welcome page).
# The host firewall denies inbound 80/443 entirely (see deploy/bootstrap-vps.sh).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 127.0.0.1:80;
    listen [::1]:80;
    server_name sre-agent.siloed.dev;

    include /etc/nginx/snippets/langfuse-proxy.conf;
}

# HTTPS is terminated by Cloudflare at the edge (see README "Point a domain
# via Cloudflare"). This TLS block is only needed for end-to-end encryption
# between Cloudflare and the VPS (SSL/TLS mode Full (strict)) — uncomment
# and add a Cloudflare Origin Certificate if you want that.
#
# server {
#     listen 127.0.0.1:443 ssl;
#     listen [::1]:443 ssl;
#     server_name sre-agent.siloed.dev;
#
#     ssl_certificate     /etc/ssl/certs/sre-agent.pem;
#     ssl_certificate_key /etc/ssl/private/sre-agent.key;
#     ssl_protocols       TLSv1.2 TLSv1.3;
#     ssl_ciphers         HIGH:!aNULL:!MD5;
#
#     include /etc/nginx/snippets/langfuse-proxy.conf;
# }
