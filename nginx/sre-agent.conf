# nginx reverse proxy for LangFuse dashboard with custom auth
#
# Deploy: copy to /etc/nginx/sites-available/sre-agent.conf
#         ln -s /etc/nginx/sites-available/sre-agent.conf /etc/nginx/sites-enabled/
#         nginx -t && systemctl reload nginx

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP — redirect to HTTPS when TLS is configured; serve directly otherwise
server {
    listen 80;
    server_name sre-agent.siloed.dev;

    # Uncomment the next two lines when TLS is configured:
    # return 301 https://$host$request_uri;

    include /etc/nginx/snippets/langfuse-proxy.conf;
}

# HTTPS — enable when a certificate is available (Cloudflare origin cert,
# Let's Encrypt, or self-signed). Cloudflare DNS in front is optional.
