# Shared proxy logic — included by both the HTTP and HTTPS server blocks.
# Save as /etc/nginx/snippets/langfuse-proxy.conf

# Internal endpoint: auth_request delegates here to validate the session cookie
location = /_auth {
    internal;
    proxy_pass http://127.0.0.1:8081/_auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
}

# Login page — no auth check on the login form itself
location /login {
    proxy_pass http://127.0.0.1:8081/login;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

# Everything else: require a valid session cookie
location / {
    auth_request /_auth;
    error_page 401 = @login_redirect;

    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket support (LangFuse uses Next.js hot-reload and server-sent events)
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
}

location @login_redirect {
    return 302 /login?next=$request_uri;
}
