# Shared proxy logic — included by both the HTTP and HTTPS server blocks.
# Save as /etc/nginx/snippets/langfuse-proxy.conf
#
# SSO is enforced upstream by Cloudflare Access before a request ever
# reaches this nginx instance, so no local auth_request layer is needed here.

location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket support (LangFuse uses Next.js hot-reload and server-sent events)
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
}
