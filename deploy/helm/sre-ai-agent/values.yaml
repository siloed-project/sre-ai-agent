replicaCount: 1

image:
  repository: ghcr.io/siloed-project/sre-ai-agent
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""

rbac:
  create: true

# Existing Secret containing ANTHROPIC_API_KEY, TELEGRAM_BOT_TOKEN, and
# ALLOWED_CHAT_IDS. The chart never creates application credentials.
existingSecret: sre-ai-agent-env

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

podSecurityContext:
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 10001
